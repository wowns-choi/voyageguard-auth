spring.application.name=voyageguard-auth
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3310/voyageguard_auth
spring.datasource.username=root
spring.datasource.password=voyageguard1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 구글 OAuth2 - registrationId가 "google"이면 Spring Security가 authorization-uri/token-uri/
# user-info-uri/jwk-set-uri를 CommonOAuth2Provider 기본값으로 자동 채워줌 - client-id/secret만 있으면 됨
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# 우리 자체 JWT 서명 키 - 비대칭키(RSA). 개인키로만 발급하고 공개키로 검증하는 구조라,
# 나중에 AWS API Gateway로 분리되면 공개키만 JWKS로 공개해서 Gateway 내장 JWT 검증
# 기능을 그대로 쓸 수 있음(대칭키였다면 시크릿을 Gateway와 공유해야 해서 그 기능을 못 씀).
# 이 개인키는 이 서비스(Auth) 밖으로 절대 나가지 않음 - Sales/Payment는 공개키만 가진
# JwtVerifier로 검증만 함.
jwt.private-
jwt.public-
jwt.expiration-ms=3600000

management.endpoints.web.exposure.include=health,prometheus

# 콘솔뿐 아니라 파일로도 로그를 남김(레포 안 logs/, gitignore 처리) - Promtail이 이 파일을
# 지켜보다가 Loki로 보냄
logging.file.name=logs/auth.log

# 로그를 JSON(ECS 스키마)으로 남김 - Loki에서 필드별 필터링 가능해짐
logging.structured.format.console=ecs
logging.structured.format.file=ecs
